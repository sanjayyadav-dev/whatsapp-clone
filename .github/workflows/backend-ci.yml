name: Backend CI

on:
  pull_request:
    branches: [development, staging, main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore WhatsAppClone.Api.slnx
      - run: dotnet build WhatsAppClone.Api.slnx -c Release --no-restore
      - run: dotnet test WhatsAppClone.Api.slnx -c Release --no-build --verbosity normal